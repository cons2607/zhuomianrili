[package]
name = "desktop-calendar"
version = "0.1.0"
description = "桌面日历：照片换肤 + 文本解析 + 特定提醒语义的本地桌面日历"
authors = ["你"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 托盘 / 单实例 / 自启（自启=HKCU Run，免管理员）
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# M2 静默 Toast：sound(None) → <audio silent="true"/>（实测确认），无 WebView 开销
tauri-winrt-notification = "0.8"
# M3 文本解析（规则引擎）
regex = "1"
# M4 主题系统（图片颜色提取）
image = "0.25"
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Globalization"] }
windows-future = "0.3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
